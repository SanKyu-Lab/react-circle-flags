name: Checks

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        required: true
        default: 24.x
      ensure-generated-clean:
        type: boolean
        required: true
        default: false
      upload-coverage:
        type: boolean
        required: true
        default: true
    secrets:
      CODECOV_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      node-version:
        description: Node.js version
        type: string
        required: true
        default: 24.x
      ensure-generated-clean:
        description: Fail if generated files changed
        type: boolean
        required: true
        default: false
      upload-coverage:
        description: Upload coverage to Codecov (requires CODECOV_TOKEN)
        type: boolean
        required: true
        default: true

jobs:
  check:
    name: ${{ matrix.check.name }}
    runs-on: ubuntu-latest
    env:
      TURBO_CACHE_DIR: .turbo
    strategy:
      fail-fast: true
      matrix:
        check:
          - id: format
            name: Format
          - id: lint-typecheck
            name: Lint + Typecheck
          - id: test
            name: Tests
          - id: build
            name: Build

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Setup pnpm + Node.js
        uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ inputs.node-version }}

      - name: Run checks
        run: >
          node scripts/gha/run-checks.mjs
          --check-id "${{ matrix.check.id }}"
          ${{ inputs.ensure-generated-clean && '--ensure-generated-clean' || '' }}

      - name: Upload coverage to Codecov
        if: matrix.check.id == 'test' && inputs.upload-coverage == true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: ./coverage/react/lcov.info,./coverage/vue/lcov.info,./coverage/solid/lcov.info,./coverage/svelte/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: true

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## ${{ matrix.check.name }}"
            echo ""
            echo "- Check: \`${{ matrix.check.id }}\`"
            echo "- Node: \`${{ inputs.node-version }}\`"
            echo "- ensure-generated-clean: \`${{ inputs.ensure-generated-clean }}\`"
            echo "- upload-coverage: \`${{ inputs.upload-coverage }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
